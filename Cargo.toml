[package]
name = "sensor-blocker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
inotify = { version = "0.11", default-features = false }
rsbinder = { version = "=0.12.0", default-features = false, features = ["android_13_plus"] }
tokio = { version = "1.53", features = ["fs", "rt", "sync"] }

[patch.crates-io]
rsbinder = { path = "target/rsbinder-patched" }

[profile.release]
lto = true
strip = true
